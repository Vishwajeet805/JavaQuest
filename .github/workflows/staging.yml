name: Staging CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/vsingh13112006-art/javaquest

jobs:
  images:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - { name: api, file: apps/api/Dockerfile, context: . }
          - { name: web, file: apps/web/Dockerfile, context: . }
          - { name: runner-worker, file: apps/runner-worker/Dockerfile, context: . }
          - { name: java-runner, file: infra/runner/Dockerfile, context: infra/runner }

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - uses: docker/build-push-action@v6
        with:
          context: "${{ matrix.context }}"
          file: "${{ matrix.file }}"
          push: true
          build-args: "NEXT_PUBLIC_API_URL=https://${{ vars.STAGING_DOMAIN }}/api"
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:main
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env: { SSH_KEY: "${{ secrets.STAGING_SSH_KEY }}", SSH_HOST: "${{ secrets.STAGING_HOST }}" }
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Upload deployment contract
        env: { SSH_HOST: "${{ secrets.STAGING_HOST }}", SSH_USER: "${{ secrets.STAGING_USER }}" }
        run: scp infra/staging/{docker-compose.yml,Caddyfile,deploy.sh} scripts/smoke-staging.mjs "$SSH_USER@$SSH_HOST:/opt/javaquets/"
      - name: Deploy and verify
        env: { SSH_HOST: "${{ secrets.STAGING_HOST }}", SSH_USER: "${{ secrets.STAGING_USER }}" }
        run: ssh "$SSH_USER@$SSH_HOST" "cd /opt/javaquets && IMAGE_TAG=${GITHUB_SHA} sh deploy.sh"
