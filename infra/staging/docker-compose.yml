name: javaquets-staging
services:
  gateway:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { STAGING_DOMAIN: "${STAGING_DOMAIN}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
  web:
    image: "${IMAGE_REGISTRY}/web:${IMAGE_TAG}"
    restart: unless-stopped
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 15s, timeout: 5s, retries: 5 }
  api:
    image: "${IMAGE_REGISTRY}/api:${IMAGE_TAG}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: "${DATABASE_URL}"
      WEB_ORIGIN: "https://${STAGING_DOMAIN}"
      TRUST_PROXY: "true"
      METRICS_TOKEN: "${METRICS_TOKEN}"
      RUNNER_SERVICE_URL: http://runner-worker:4100
      RUNNER_SERVICE_TOKEN: "${RUNNER_SERVICE_TOKEN}"
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 15s, timeout: 5s, retries: 5 }
    depends_on:
      runner-worker: { condition: service_healthy }
  runner-worker:
    image: "${IMAGE_REGISTRY}/runner-worker:${IMAGE_TAG}"
    restart: unless-stopped
    environment:
      RUNNER_SERVICE_TOKEN: "${RUNNER_SERVICE_TOKEN}"
      JAVA_RUNNER_IMAGE: "${JAVA_RUNNER_IMAGE}"
      RUNNER_MAX_CONCURRENCY: 2
      RUNNER_MAX_QUEUE: 8
      RUNNER_MAX_OUTPUT_BYTES: 16384
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:4100/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 15s, timeout: 5s, retries: 5 }
  migrate:
    image: "${IMAGE_REGISTRY}/api:${IMAGE_TAG}"
    profiles: ["tools"]
    environment: { DATABASE_URL: "${DATABASE_URL}" }
    command: ["pnpm", "--filter", "@javaquets/database", "db:migrate:deploy"]
volumes:
  caddy_data:
