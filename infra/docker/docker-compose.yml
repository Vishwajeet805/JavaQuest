services:
  postgres:
    image: postgres:17
    container_name: javaquets_postgres

    environment:
      POSTGRES_DB: javaquets
      POSTGRES_USER: javaquets
      POSTGRES_PASSWORD: javaquets

    ports:
      - "5432:5432"

    volumes:
      - javaquets_postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U javaquets"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  javaquets_postgres:
